name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build and check ABI
        run: |
          mkdir -p build
          go build -trimpath -buildmode=c-shared -o build/ollama-usage-monitor.so .
          python3 scripts/abi_smoke.py build/ollama-usage-monitor.so
          tar -czf ollama-usage-monitor_linux_${{ matrix.arch }}.tar.gz -C build ollama-usage-monitor.so
      - uses: actions/upload-artifact@v4
        with:
          name: ollama-usage-monitor_linux_${{ matrix.arch }}
          path: '*.tar.gz'
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: sha256sum *.tar.gz > checksums.txt
        working-directory: assets
      - run: gh release create "$TAG" assets/*.tar.gz assets/checksums.txt --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
